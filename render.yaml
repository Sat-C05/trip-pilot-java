# Candidate only: configure secret file mysql-ca.pem and evaluate model before creating service.
services:
  - type: web
    name: trippilot-coursework
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./infra/deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: off
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MODEL_ID
        value: gemini-3.5-flash-lite
      - key: GEMINI_MIN_CALL_INTERVAL_MS
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
