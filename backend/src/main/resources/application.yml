server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8002}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: trippilot-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/trippilot}
    username: ${DB_USERNAME:trippilot}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  session:
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

trippilot:
  harness:
    version: validation-v1
    model-turns: 12
    searches: 8
    pages: 12
    output-repairs: 1
    job-seconds: 600
    model-call-seconds: 90
    fetch-seconds: 15
    page-bytes: 2097152
    source-characters: 30000
    output-tokens: 768
    price-fresh-hours: 6
    availability-fresh-minutes: 15
    policy-fresh-days: 7
    description-fresh-days: 30
    trace-retention-days: 14
  research:
    workers: 3
  model:
    # Runtime and exact artifact are selected and measured in Phase 1.
    base-url: ${MODEL_BASE_URL:http://127.0.0.1:11436}
    model-id: ${MODEL_ID:gemma4:e4b}
    inference-concurrency: 1
    context-tokens: ${MODEL_CONTEXT_TOKENS:4096}
  model-runtime:
    provider: ollama
    artifact-fingerprint: ${MODEL_ARTIFACT_FINGERPRINT:c6eb396dbd5992bbe3f5cdb947e8bbc0ee413d7c17e2beaae69f5d569cf982eb}
    runtime-version: ${MODEL_RUNTIME_VERSION:0.20.4}
    prompt-version: extractive-v2
    temperature: 0
    seed: 42
  booking:
    enabled: ${BOOKING_ENABLED:false}
    provider-base-url: ${BOOKING_PROVIDER_BASE_URL:http://127.0.0.1:8081}
    environment-label: ${BOOKING_ENVIRONMENT_LABEL:Demo provider — simulated stays, no payment or real reservations}

